# 버티포트 시뮬레이션 공통 파라미터
# - 좌표: World ENU, 원점 = 착륙패드 중심 (docs/INTERFACE.md)
# - origin_offset_enu = PX4 local 원점(EKF 초기화 시 base_link 위치)의 World 좌표
#   = (스폰 x, 스폰 y, base_link 높이 0.24). launch 인자 spawn_x/spawn_y 로 덮어쓴다 → run_sim.sh 와 항상 일치
/**:
  ros__parameters:
    origin_offset_enu: [-6.0, 0.0, 0.24]
    pad_xy: [0.0, 0.0]          # 팀 좌표 원점 = 패드 중심 → 바꾸지 말 것
    pad_size_m: 3.0
    world_name: vertiport
    camera_mount_xyz: [0.0, 0.0, -0.14]     # base_link → camera_link (x500_mono_cam_down SDF 기준)
    camera_mount_rpy: [0.0, 1.5707, 0.0]
    topics:                     # PX4 v1.17 기준. 다르면 노드가 _vN 변형을 자동 탐색
      local_position: /fmu/out/vehicle_local_position_v1
      attitude: /fmu/out/vehicle_attitude
      status: /fmu/out/vehicle_status_v1
      land_detected: /fmu/out/vehicle_land_detected
      offboard_control_mode: /fmu/in/offboard_control_mode
      trajectory_setpoint: /fmu/in/trajectory_setpoint
      vehicle_command: /fmu/in/vehicle_command

vertiport_commander:
  ros__parameters:
    rate_hz: 20.0
    target_system: 1
    min_takeoff_alt: 1.5
    max_speed_xy: 1.5
    max_speed_z: 1.0
    descent_rate: 0.5
    arrive_tol: 0.25
    align_tol: 0.25
    touchdown_alt: 0.5
    xy_limit: 60.0
    z_min: 1.0
    z_max: 30.0
    warmup_cycles: 10
    request_retry_s: 1.0
    arm_timeout_s: 10.0
    override_grace_s: 1.0

vertiport_telemetry_bridge:
  ros__parameters:
    rate_hz: 20.0
    source: sim                 # 실기체 연결 시 real (launch 의 sim:=false 가 자동 설정)
    tf_stamp_source: px4        # px4: PX4/시뮬레이션 시간 (카메라 stamp 와 같은 시간축) / ros: 노드 시계
    frames:
      map: map
      base: base_link
      camera: camera_link
      camera_optical: camera_optical_frame

vertiport_http_bridge:
  ros__parameters:
    http_host: 0.0.0.0
    http_port: 8080
    public_base_url: ""          # 비우면 요청 Host 헤더로 camera_stream_url 생성. 예: "http://192.168.0.10:8080"
    vehicle_id: X500-01
    command_timeout_s: 2.0
    landing_request_max_age_s: 3.0    # request_landing 의 telemetry_id 유효시간 (대시보드 텔레메트리 유효시간 3초와 동일)
    telemetry_stale_s: 1.0
    pad_z: 0.0                    # 패드 면의 Gazebo z
    gear_height_m: 0.24           # base_link 높이 (altitude_m = z - pad_z - gear_height_m)
    local_frame_yaw_deg: 0.0      # VERTIPORT_LOCAL_XYZ_UP = ENU 로 대시보드와 합의 (2026-11-25) → 0
    camera_topic: /camera/down/image_raw
    camera_info_topic: /camera/down/camera_info
    perception_image_topic: /vertiport/perception/image   # 통합 프로그램의 탐지 결과 영상 (선택)
    stream_fps: 10.0
    stream_max_width: 960
    jpeg_quality: 80

vertiport_scenario:
  ros__parameters:
    initial_scenario: S0_clear
    gt_rate_hz: 2.0

vertiport_mock_judge:
  ros__parameters:
    act: true
    auto_mission: false
    approach_alt: 4.0
    person_radius_m: 5.0
    vehicle_radius_m: 8.0
    fod_margin_m: 0.5
